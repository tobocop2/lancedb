[profile.release]
lto = "fat"
codegen-units = 1

[profile.release-with-debug]
inherits = "release"
debug = true
# Prioritize compile time over runtime performance
codegen-units = 16
lto = "thin"

[target.'cfg(all())']
rustflags = [
    "-Wclippy::all",
    "-Wclippy::style",
    "-Wclippy::fallible_impl_from",
    "-Wclippy::manual_let_else",
    "-Wclippy::redundant_pub_crate",
    "-Wclippy::string_add_assign",
    "-Wclippy::string_add",
    "-Wclippy::string_lit_as_bytes",
    "-Wclippy::implicit_clone",
    "-Wclippy::use_self",
    "-Dclippy::cargo",
    "-Dclippy::dbg_macro",
    # not too much we can do to avoid multiple crate versions
    "-Aclippy::multiple-crate-versions",
    "-Aclippy::wildcard_dependencies",
]

# COMPAT BUILD: x86_64 baseline lowered from haswell to x86-64-v2 (SSE4.2, no
# AVX2/FMA/F16C) and the forced AVX features removed, so the compiler does not
# bake AVX2 into the binary. The embedded lance crate (tobocop2/lance
# v9.0.0-beta.8-compat) selects AVX2/AVX-512 kernels at runtime, so modern CPUs
# stay fast while pre-Haswell hosts no longer SIGILL at import.
[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "target-cpu=x86-64-v2"]

[target.x86_64-unknown-linux-musl]
rustflags = ["-C", "target-cpu=x86-64-v2", "-C", "target-feature=-crt-static"]

[target.aarch64-unknown-linux-musl]
linker = "aarch64-linux-musl-gcc"
rustflags = ["-C", "target-feature=-crt-static"]

[target.aarch64-apple-darwin]
rustflags = ["-C", "target-cpu=apple-m1", "-C", "target-feature=+neon,+fp16,+fhm,+dotprod"]

# COMPAT BUILD: macOS x86_64 had no explicit baseline (defaulted to generic v1).
# Pin x86-64-v2 to match the Linux/Windows compat baseline.
[target.x86_64-apple-darwin]
rustflags = ["-C", "target-cpu=x86-64-v2"]

# Not all Windows systems have the C runtime installed, so this avoids library
# not found errors on systems that are missing it.
# COMPAT BUILD: add the x86-64-v2 baseline alongside the static-CRT flag.
[target.x86_64-pc-windows-msvc]
rustflags = ["-Ctarget-feature=+crt-static", "-C", "target-cpu=x86-64-v2"]

# Experimental target for Arm64 Windows
[target.aarch64-pc-windows-msvc]
rustflags = ["-Ctarget-feature=+crt-static"]
